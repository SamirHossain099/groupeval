line-length = 100
target-version = "py39"

[lint]
# Errors, pyflakes, imports, modernisation. Deliberately NOT enabling stylistic
# rewrites (C4 dict-literal etc.): they add churn without changing behaviour.
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # line length is handled by line-length above
    "E402",   # module import not at top: resources MUST precede numpy, by design
]
