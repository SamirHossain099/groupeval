[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groupeval"
version = "0.1.0"
description = "Evaluation that respects the group structure benchmarks actually have: duplicate audits, group-disjoint splits, clustered intervals, and resolution limits."
readme = "groupeval/README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Samir Hossain" }]
keywords = ["benchmark", "evaluation", "data-leakage", "clustered-data", "medical-imaging",
            "confidence-intervals", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Source = "https://github.com/SamirHossain099/groupeval"
Archive = "https://doi.org/10.5281/zenodo.22347243"

[tool.setuptools]
packages = ["groupeval"]
# MANIFEST.in exists to keep the audit's files out of the SDIST. With pyproject-based
# setuptools, include-package-data defaults to true, so those same rules also fed the
# WHEEL: the package's own tests and EXAMPLE.md started being installed into
# site-packages, 30 KB of them, and falsified a comment in test_packaging.py that says
# they are not shipped. Tests belong in the source distribution, not in the wheel.
include-package-data = false

[tool.ruff]
line-length = 100
