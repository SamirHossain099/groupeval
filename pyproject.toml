[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groupeval"
version = "0.1.0"
description = "Evaluation that respects the group structure benchmarks actually have: duplicate audits, group-disjoint splits, clustered intervals, and resolution limits."
readme = "groupeval/README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Samir Hossain" }]
keywords = ["benchmark", "evaluation", "data-leakage", "clustered-data", "medical-imaging",
            "confidence-intervals", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Source = "https://github.com/SamirHossain099/groupeval"

[tool.setuptools]
packages = ["groupeval"]

[tool.ruff]
line-length = 100
